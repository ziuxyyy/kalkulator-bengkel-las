<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Material - Bengkel Las Ajaib (Supabase)</title>
    
    <!-- Library Eksternal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background: #f4f7f6; color: #333; line-height: 1.6; margin: 0; }
        .container { max-width: 1050px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* LOGIN SCREEN */
        #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #1e293b; color: white; position: fixed; top:0; left:0; width:100%; z-index: 9999; }
        #loginScreen h1 { font-size: 32px; margin-bottom: 5px; text-align: center;}
        #loginScreen p { margin-bottom: 20px; color: #94a3b8; }
        #loginScreen input { padding: 12px; margin-bottom: 15px; width: 280px; border-radius: 5px; border: none; outline: none; font-size: 14px; text-align: center; color: #333;}
        #loginScreen input:focus { box-shadow: 0 0 8px rgba(14, 165, 233, 0.8); }
        .btn-login { background: #0ea5e9; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 305px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s;}
        .btn-login:hover { background: #0284c7; }
        
        #appContent { display: none; }

        .header-bar { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
        .title-bengkel { color: #1e293b; font-size: 24px; margin: 0; font-weight: 900; letter-spacing: 1px;}
        
        .user-info { font-size: 13px; font-weight: bold; color: #64748b; display: flex; align-items: center; gap: 10px;}
        .btn-logout { background: #64748b; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; border: none; cursor: pointer;}
        
        .project-manager { background: #f0f9ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bae6fd; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .project-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%;}
        select, input[type="text"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; width: 100%;}
        
        button { cursor: pointer; border: none; border-radius: 5px; font-weight: bold; padding: 8px 12px; font-size: 13px; transition: 0.2s;}
        
        .btn-proj-new { background: #10b981; color: white; }
        .btn-proj-rename { background: #f59e0b; color: white; }
        .btn-proj-del { background: #ef4444; color: white; }
        
        .form-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        label { font-size: 12px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px; }
        .btn-tambah { background: #10b981; color: white; align-self: end; height: 38px;}

        h2 { color: #334155; font-size: 16px; margin-top: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; min-width: 600px; }
        th, td { border: 1px solid #cbd5e1 !important; padding: 8px; text-align: left; }
        th { background-color: #1e293b; color: white; position: sticky; top: 0;}
        tr:nth-child(even) { background-color: #f8fafc; }
        
        [contenteditable="true"] { background-color: #fef08a; border: 1px dashed #f59e0b !important; min-width: 40px; }
        .delete-btn { background: #ef4444; color: white; padding: 5px 10px; font-size: 11px; }
        .status-save { font-size: 12px; color: #10b981; font-weight: bold; background: #ecfdf5; padding: 5px 10px; border-radius: 15px; display: inline-block;}

        @media (max-width: 600px) {
            .header-bar { flex-direction: column; }
            .project-manager { flex-direction: column; align-items: stretch; }
            select { width: 100% !important; }
        }
    </style>
</head>
<body>

    <!-- LAYAR LOGIN USERNAME & PASSWORD -->
    <div id="loginScreen">
        <h1>BENGKEL LAS AJAIB</h1>
        <p>Silakan Masuk Untuk Mengakses Data (Supabase)</p>
        
        <input type="email" id="emailInput" placeholder="Masukkan Email">
        <input type="password" id="passwordInput" placeholder="Masukkan Password">
        
        <button class="btn-login" onclick="loginManual()">Masuk</button>
        <div id="loginError" style="color: #f87171; margin-top: 15px; font-size: 14px; text-align:center;"></div>
    </div>

    <!-- KONTEN APLIKASI -->
    <div class="container" id="appContent">
        <div class="header-bar">
            <div>
                <h1 class="title-bengkel">BENGKEL LAS AJAIB</h1>
                <div class="user-info">
                    <span id="userName">User</span> 
                    <button class="btn-logout" onclick="logoutManual()">Keluar</button>
                </div>
            </div>
            <div>
                <span class="status-save" id="saveStatus">🔄 Menunggu Sinkronisasi...</span>
            </div>
        </div>

        <div class="project-manager">
            <div class="project-controls">
                <label style="margin-bottom:0; font-size: 14px;">Proyek Aktif:</label>
                <select id="projectSelector" onchange="gantiProyek()" style="font-weight: bold; background: #fff;"></select>
                <button class="btn-proj-new" onclick="buatProyekBaru()">➕ Baru</button>
                <button class="btn-proj-rename" onclick="ubahNamaProyek()">✏️ Rename</button>
                <button class="btn-proj-del" onclick="hapusProyek()">🗑️ Hapus</button>
            </div>
        </div>
        
        <div>
            <div style="margin-bottom: 15px;">
                <label>Input Kategori Material:</label>
                <select id="tipeMaterial" onchange="toggleForm()" style="max-width: 300px; font-weight:bold;">
                    <option value="besi">Besi / Profil (Lonjoran)</option>
                    <option value="plat">Lembaran / Plat (Triplek/Besi)</option>
                    <option value="baut">Baut / Aksesoris (Pcs)</option>
                </select>
            </div>

            <div class="form-group" id="inputForm">
                <div><label>Jenis Material</label><input type="text" id="jenis" placeholder="Cth: Hollow 4x4"></div>
                <div><label>Bagian</label><input type="text" id="bagian" placeholder="Cth: Kaki Meja"></div>
                <div id="col-p"><label>Pjg (mm)</label><input type="number" id="p" value="0"></div>
                <div id="col-l" style="display: none;"><label>Lbr (mm)</label><input type="number" id="l" value="0"></div>
                <div><label>Qty</label><input type="number" id="qty" value="1"></div>
                <div id="col-stdP"><label id="label-stdP">Std Pjg (mm)</label><input type="number" id="stdP" value="6000"></div>
                <div id="col-stdL" style="display: none;"><label>Std Lbr (mm)</label><input type="number" id="stdL" value="1220"></div>
                <button class="btn-tambah" onclick="tambahItem()">+ Tambah</button>
            </div>
        </div>

        <h2><span>Rincian Kebutuhan</span> <button style="background:#ef4444; color:white;" onclick="bersihkanTabel()">🧹 Bersihkan Tabel</button></h2>
        <div class="table-responsive">
            <table id="tableRincian">
                <thead>
                    <tr><th>Tipe</th><th>Jenis</th><th>Bagian</th><th>Pjg(mm)</th><th>Lbr(mm)</th><th>Qty</th><th>Std Pjg</th><th>Std Lbr</th><th>Aksi</th></tr>
                </thead>
                <tbody id="tabelRincianBody"></tbody>
            </table>
        </div>

        <h2><span>Rekapitulasi Belanja</span> <button style="background:#0d9488; color:white;" onclick="exportTableToCSV('tableRekap', 'Rekap.csv')">📤 Export .csv</button></h2>
        <div class="table-responsive">
            <table id="tableRekap">
                <thead>
                    <tr><th>Kategori</th><th>Jenis Material</th><th>Ukuran Standar</th><th>Total Kebutuhan</th><th>Butuh (Beli)</th><th>Sisa / Lebih</th></tr>
                </thead>
                <tbody id="tabelRekapBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // KONFIGURASI SUPABASE (Ganti dengan URL & Anon Key project Anda)
        const SUPABASE_URL = 'https://URL_PROJECT_ANDA.supabase.co';
        const SUPABASE_ANON_KEY = 'SUPABASE_ANON_KEY_ANDA';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let projects = { "Proyek Utama": [] };
        let currentProject = "Proyek Utama";
        let dataMaterial = []; 
        let isSyncing = false;

        // Cek Sesi Auth saat halaman dimuat
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                tampilkanAplikasi(session.user.email);
            } else {
                tampilkanLogin();
            }
        });

        // Listener perubahan Auth State Supabase
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                tampilkanAplikasi(session.user.email);
            } else {
                tampilkanLogin();
            }
        });

        function tampilkanAplikasi(email) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            document.getElementById('userName').innerText = email;
            ambilDataDariCloud();
            mulaiRealtimeSync();
        }

        function tampilkanLogin() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContent').style.display = 'none';
        }

        async function loginManual() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorDiv = document.getElementById('loginError');

            if(!email || !password) {
                errorDiv.innerText = "Email dan password tidak boleh kosong!";
                errorDiv.style.color = "#f87171";
                return;
            }

            errorDiv.innerText = "⏳ Sedang memeriksa...";
            errorDiv.style.color = "#38bdf8";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorDiv.style.color = "#f87171";
                errorDiv.innerText = "⚠️ Login Gagal! Pastikan Email dan Password benar.";
            } else {
                errorDiv.innerText = ""; 
            }
        }

        async function logoutManual() { 
            await supabaseClient.auth.signOut();
            document.getElementById('emailInput').value = ""; 
            document.getElementById('passwordInput').value = "";
        }

        async function ambilDataDariCloud() {
            const status = document.getElementById('saveStatus');
            status.innerText = "⏳ Memuat data..."; 
            status.style.color = "#d97706";

            const { data, error } = await supabaseClient
                .from('bengkel_data')
                .select('*')
                .eq('key', 'data_kalkulator')
                .single();

            if (data) {
                if (data.projects) projects = data.projects;
                if (data.current_project && projects[data.current_project]) {
                    currentProject = data.current_project;
                } else {
                    currentProject = Object.keys(projects)[0];
                }
            } else {
                // Jika data belum ada di database, inisialisasi awal
                projects = { "Proyek Utama": [] };
                currentProject = "Proyek Utama";
                await simpanKeCloud();
            }
            updateProjectUI();
            
            status.innerText = "🟢 Real-time aktif"; 
            status.style.color = "#10b981";
        }

        function mulaiRealtimeSync() {
            supabaseClient
                .channel('public:bengkel_data')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'bengkel_data' }, payload => {
                    if (!isSyncing && payload.new && payload.new.key === 'data_kalkulator') {
                        const cloudData = payload.new;
                        if (cloudData.projects) {
                            projects = cloudData.projects;
                        }
                        if (cloudData.current_project && projects[cloudData.current_project]) {
                            currentProject = cloudData.current_project;
                        }
                        updateProjectUI();
                    }
                })
                .subscribe();
        }

        async function simpanKeCloud() {
            projects[currentProject] = dataMaterial; 
            const status = document.getElementById('saveStatus');
            status.innerText = "⏳ Menyimpan..."; 
            status.style.color = "#d97706";
            
            isSyncing = true;
            const { error } = await supabaseClient
                .from('bengkel_data')
                .upsert({ 
                    key: 'data_kalkulator', 
                    projects: projects, 
                    current_project: currentProject,
                    updated_at: new Date()
                }, { onConflict: 'key' });

            isSyncing = false;
            
            if (!error) {
                status.innerText = "🟢 Real-time aktif"; 
                status.style.color = "#10b981";
            } else {
                status.innerText = "⚠️ Gagal Menyimpan"; 
                status.style.color = "#ef4444";
            }
        }

        function updateProjectUI() {
            const selector = document.getElementById('projectSelector');
            const nilaiSebelumnya = selector.value;
            
            selector.innerHTML = '';
            for (let proj in projects) {
                let opt = document.createElement('option');
                opt.value = proj; opt.innerText = proj;
                selector.appendChild(opt);
            }
            
            if(projects[nilaiSebelumnya]) {
                selector.value = nilaiSebelumnya;
                currentProject = nilaiSebelumnya;
            } else {
                selector.value = currentProject;
            }

            dataMaterial = projects[currentProject] || [];
            renderTabel();
        }

        function gantiProyek() {
            currentProject = document.getElementById('projectSelector').value;
            simpanKeCloud();
        }

        function buatProyekBaru() {
            let nama = prompt("Masukkan nama proyek baru:");
            if (nama && nama.trim() !== "") {
                if (projects[nama]) return alert("Nama proyek sudah ada!");
                projects[nama] = []; currentProject = nama; 
                simpanKeCloud();
            }
        }

        function ubahNamaProyek() {
            let namaBaru = prompt("Ubah nama proyek:", currentProject);
            if (namaBaru && namaBaru.trim() !== "" && namaBaru !== currentProject) {
                if (projects[namaBaru]) return alert("Nama tersebut sudah dipakai!");
                projects[namaBaru] = projects[currentProject];
                delete projects[currentProject]; currentProject = namaBaru;
                simpanKeCloud();
            }
        }

        function hapusProyek() {
            if (Object.keys(projects).length <= 1) return alert("Minimal harus ada 1 proyek.");
            if (confirm(`Yakin ingin menghapus seluruh data pada "${currentProject}"?`)) {
                delete projects[currentProject];
                currentProject = Object.keys(projects)[0];
                simpanKeCloud();
            }
        }

        function bersihkanTabel() {
            if (confirm("Hapus semua rincian di tabel ini?")) {
                dataMaterial = [];
                simpanKeCloud();
            }
        }

        function toggleForm() {
            const tipe = document.getElementById('tipeMaterial').value;
            document.getElementById('col-p').style.display = tipe !== 'baut' ? 'block' : 'none';
            document.getElementById('col-l').style.display = tipe === 'plat' ? 'block' : 'none';
            document.getElementById('col-stdP').style.display = tipe !== 'baut' ? 'block' : 'none';
            document.getElementById('col-stdL').style.display = tipe === 'plat' ? 'block' : 'none';
            if(tipe === 'besi') { document.getElementById('label-stdP').innerText = 'Std Pjg (mm)'; document.getElementById('stdP').value = 6000; }
            if(tipe === 'plat') { document.getElementById('label-stdP').innerText = 'Std Pjg (mm)'; document.getElementById('stdP').value = 2440; document.getElementById('stdL').value = 1220; }
        }

        function tambahItem() {
            const tipe = document.getElementById('tipeMaterial').value;
            const jenis = document.getElementById('jenis').value.trim();
            const bagian = document.getElementById('bagian').value.trim();
            const qty = parseInt(document.getElementById('qty').value) || 0;
            const p = tipe !== 'baut' ? parseFloat(document.getElementById('p').value) || 0 : 0;
            const l = tipe === 'plat' ? parseFloat(document.getElementById('l').value) || 0 : 0;
            const stdP = tipe !== 'baut' ? parseFloat(document.getElementById('stdP').value) || 0 : 0;
            const stdL = tipe === 'plat' ? parseFloat(document.getElementById('stdL').value) || 0 : 0;

            if (!jenis || qty <= 0) return alert("Jenis dan Qty wajib diisi!");
            dataMaterial.push({ id: Date.now(), tipe, jenis, bagian, p, l, qty, stdP, stdL });
            
            document.getElementById('bagian').value = ''; 
            document.getElementById('qty').value = '1'; 
            document.getElementById('jenis').focus(); 
            
            simpanKeCloud(); 
        }

        function hapusItem(id) { dataMaterial = dataMaterial.filter(item => item.id !== id); simpanKeCloud(); }
        
        function updateData(id, field, value) {
            let item = dataMaterial.find(x => x.id === id);
            if(item) {
                let parsedVal = ['p','l','qty','stdP','stdL'].includes(field) ? (parseFloat(value) || 0) : value.trim();
                if (item[field] !== parsedVal) { item[field] = parsedVal; simpanKeCloud(); }
            }
        }

        function renderTabel() {
            const tbodyRincian = document.getElementById('tabelRincianBody');
            const tbodyRekap = document.getElementById('tabelRekapBody');
            tbodyRincian.innerHTML = ''; tbodyRekap.innerHTML = '';
            let rekapMap = {};

            dataMaterial.forEach(item => {
                const isBesi = item.tipe === 'besi', isPlat = item.tipe === 'plat', isBaut = item.tipe === 'baut';
                tbodyRincian.innerHTML += `
                    <tr>
                        <td>${item.tipe.toUpperCase()}</td>
                        <td contenteditable="true" onblur="updateData(${item.id}, 'jenis', this.innerText)">${item.jenis}</td>
                        <td contenteditable="true" onblur="updateData(${item.id}, 'bagian', this.innerText)">${item.bagian}</td>
                        <td ${!isBaut ? 'contenteditable="true"' : ''} onblur="updateData(${item.id}, 'p', this.innerText)">${!isBaut ? item.p : '-'}</td>
                        <td ${isPlat ? 'contenteditable="true"' : ''} onblur="updateData(${item.id}, 'l', this.innerText)">${isPlat ? item.l : '-'}</td>
                        <td contenteditable="true" onblur="updateData(${item.id}, 'qty', this.innerText)">${item.qty}</td>
                        <td ${!isBaut ? 'contenteditable="true"' : ''} onblur="updateData(${item.id}, 'stdP', this.innerText)">${!isBaut ? item.stdP : '-'}</td>
                        <td ${isPlat ? 'contenteditable="true"' : ''} onblur="updateData(${item.id}, 'stdL', this.innerText)">${isPlat ? item.stdL : '-'}</td>
                        <td><button class="delete-btn" onclick="hapusItem(${item.id})">Hapus</button></td>
                    </tr>
                `;

                let key = `${item.tipe}-${item.jenis}`;
                if (!rekapMap[key]) rekapMap[key] = { tipe: item.tipe, jenis: item.jenis, totalKebutuhan: 0, stdP: item.stdP, stdL: item.stdL };
                if (isBesi) rekapMap[key].totalKebutuhan += (item.p * item.qty);
                else if (isPlat) rekapMap[key].totalKebutuhan += (item.p * item.l * item.qty);
                else if (isBaut) rekapMap[key].totalKebutuhan += item.qty;
            });

            for (const key in rekapMap) {
                const data = rekapMap[key];
                let teksKebutuhan = '', teksBeli = '', teksSisa = '', teksStandar = '';
                if (data.tipe === 'besi') {
                    let butuhLonjor = Math.ceil(data.totalKebutuhan / data.stdP);
                    teksStandar = `${data.stdP} mm`; teksKebutuhan = `${data.totalKebutuhan} mm`; 
                    teksBeli = `${butuhLonjor} Ljr`; teksSisa = ((butuhLonjor * data.stdP) - data.totalKebutuhan > 0) ? `${(butuhLonjor * data.stdP) - data.totalKebutuhan} mm` : '0';
                } else if (data.tipe === 'plat') {
                    let luasLembar = data.stdP * data.stdL; let butuhLembar = Math.ceil(data.totalKebutuhan / luasLembar);
                    let sisaLuas = (butuhLembar * luasLembar) - data.totalKebutuhan;
                    teksStandar = `${data.stdP}x${data.stdL}`; teksKebutuhan = `${(data.totalKebutuhan / 1000000).toFixed(2)} m²`; 
                    teksBeli = `${butuhLembar} Lbr`; teksSisa = sisaLuas > 0 ? `${(sisaLuas / 1000000).toFixed(2)} m²` : '0';
                } else if (data.tipe === 'baut') {
                    teksStandar = '-'; teksKebutuhan = `${data.totalKebutuhan} Pcs`; teksBeli = `${data.totalKebutuhan} Pcs`; teksSisa = '-';
                }
                tbodyRekap.innerHTML += `<tr><td><strong>${data.tipe.toUpperCase()}</strong></td><td>${data.jenis}</td><td>${teksStandar}</td><td>${teksKebutuhan}</td><td style="color:#10b981; font-weight:bold;">${teksBeli}</td><td>${teksSisa}</td></tr>`;
            }
        }

        // Fungsi pembantu untuk export CSV (jika diperlukan)
        function exportTableToCSV(tableID, filename) {
            let csv = [];
            let rows = document.querySelectorAll("#" + tableID + " tr");
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                for (let j = 0; j < cols.length; j++) row.push('"' + cols[j].innerText + '"');
                csv.push(row.join(","));
            }
            let csvFile = new Blob([csv.join("\n")], { type: "text/csv" });
            let downloadLink = document.createElement("a");
            downloadLink.download = filename;
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
        
        window.onload = function() { toggleForm(); };
    </script>
</body>
</html>
