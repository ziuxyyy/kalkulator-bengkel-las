<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Material - Bengkel Las Ajaib</title>
    
    <!-- Library Eksternal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background: #f4f7f6; color: #333; line-height: 1.6; margin: 0; }
        .container { max-width: 1050px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* LOGIN SCREEN */
        #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #2c3e50; color: white; position: fixed; top:0; left:0; width:100%; z-index: 9999; }
        #loginScreen h1 { font-size: 32px; margin-bottom: 5px; text-align: center;}
        #loginScreen p { margin-bottom: 20px; color: #bdc3c7; }
        #loginScreen input { padding: 12px; margin-bottom: 15px; width: 280px; border-radius: 5px; border: none; outline: none; font-size: 14px; text-align: center; color: #333;}
        #loginScreen input:focus { box-shadow: 0 0 8px rgba(52, 152, 219, 0.8); }
        .btn-login { background: #e74c3c; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 305px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s;}
        .btn-login:hover { background: #c0392b; }
        
        #appContent { display: none; }

        .header-bar { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
        .title-bengkel { color: #2c3e50; font-size: 24px; margin: 0; font-weight: 900; letter-spacing: 1px;}
        
        .user-info { font-size: 13px; font-weight: bold; color: #7f8c8d; display: flex; align-items: center; gap: 10px;}
        .btn-logout { background: #7f8c8d; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; border: none; cursor: pointer;}
        
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        
        .project-manager { background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #d1e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .project-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%;}
        select, input[type="text"], input[type="number"] { padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; width: 100%;}
        
        button { cursor: pointer; border: none; border-radius: 5px; font-weight: bold; padding: 8px 12px; font-size: 13px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;}
        
        /* WARNA TOMBOL */
        .btn-proj-new { background: #27ae60; color: white; }
        .btn-proj-rename { background: #f39c12; color: white; }
        .btn-proj-del { background: #c0392b; color: white; }
        .btn-undo { background: #95a5a6; color: white; }
        .btn-redo { background: #7f8c8d; color: white; }
        .btn-import { background: #8e44ad; color: white; }
        .btn-export { background: #2980b9; color: white; }
        .btn-pdf { background: #c0392b; color: white; }
        .btn-img { background: #d35400; color: white; }
        
        .form-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; }
        label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
        .btn-tambah { background: #27ae60; color: white; align-self: end; height: 38px;}

        h2 { color: #34495e; font-size: 16px; margin-top: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; min-width: 600px; }
        th, td { border: 1px solid #ddd !important; padding: 8px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        [contenteditable="true"] { background-color: #fffde7; border: 1px dashed #f39c12 !important; min-width: 40px; }
        .delete-btn { background: #e74c3c; color: white; padding: 5px 10px; font-size: 11px; }
        .status-save { font-size: 12px; color: #27ae60; font-weight: bold; background: #e8f8f5; padding: 5px 10px; border-radius: 15px; display: inline-block;}

        #areaPrint { background: white; padding: 10px; border-radius: 8px; }

        @media (max-width: 600px) {
            .header-bar { flex-direction: column; }
            .project-manager { flex-direction: column; align-items: stretch; }
            select { width: 100% !important; }
        }
    </style>
</head>
<body>

    <!-- LAYAR LOGIN -->
    <div id="loginScreen">
        <h1>BENGKEL LAS AJAIB</h1>
        <p>Silakan Masuk Untuk Mengakses Data</p>
        
        <input type="email" id="emailInput" placeholder="Masukkan Email (Cth: bos@bengkel.com)">
        <input type="password" id="passwordInput" placeholder="Masukkan Password">
        
        <button class="btn-login" onclick="loginManual()">Masuk</button>
        <div id="loginError" style="color: #ff7675; margin-top: 15px; font-size: 14px; text-align:center;"></div>
    </div>

    <!-- KONTEN APLIKASI -->
    <div class="container" id="appContent">
        <div class="header-bar">
            <div>
                <h1 class="title-bengkel">BENGKEL LAS AJAIB</h1>
                <div class="user-info">
                    <span id="userName">User</span> 
                    <button class="btn-logout" onclick="logoutManual()">Keluar</button>
                </div>
            </div>
            <div>
                <span class="status-save" id="saveStatus">🔄 Menunggu Sinkronisasi...</span>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn-undo" onclick="undoAksi()">↩️ Undo</button>
            <button class="btn-redo" onclick="redoAksi()">↪️ Redo</button>
            <span style="flex-grow:1"></span>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
            <button class="btn-import" onclick="document.getElementById('importFile').click()">📥 Import Proyek</button>
            <button class="btn-export" onclick="exportJSON()">📤 Export Proyek</button>
        </div>

        <div class="project-manager">
            <div class="project-controls">
                <label style="margin-bottom:0; font-size: 14px;">Proyek Aktif:</label>
                <select id="projectSelector" onchange="gantiProyek()" style="font-weight: bold; background: #fff;"></select>
                <button class="btn-proj-new" onclick="buatProyekBaru()">➕ Baru</button>
                <button class="btn-proj-rename" onclick="ubahNamaProyek()">✏️ Rename</button>
                <button class="btn-proj-del" onclick="hapusProyek()">🗑️ Hapus</button>
            </div>
        </div>
        
        <div>
            <div style="margin-bottom: 15px;">
                <label>Input Kategori Material:</label>
                <select id="tipeMaterial" onchange="toggleForm()" style="max-width: 300px; font-weight:bold;">
                    <option value="besi">Besi / Profil (Lonjoran)</option>
                    <option value="plat">Lembaran / Plat (Triplek/Besi)</option>
                    <option value="baut">Baut / Aksesoris (Pcs)</option>
                </select>
            </div>

            <div class="form-group" id="inputForm">
                <div><label>Jenis Material</label><input type="text" id="jenis" placeholder="Cth: Hollow 4x4"></div>
                <div><label>Bagian</label><input type="text" id="bagian" placeholder="Cth: Kaki Meja"></div>
                <div id="col-p"><label>Pjg (mm)</label><input type="number" id="p" value="0"></div>
                <div id="col-l" style="display: none;"><label>Lbr (mm)</label><input type="number" id="l" value="0"></div>
                <div><label>Qty</label><input type="number" id="qty" value="1"></div>
                <div id="col-stdP"><label id="label-stdP">Std Pjg (mm)</label><input type="number" id="stdP" value="6000"></div>
                <div id="col-stdL" style="display: none;"><label>Std Lbr (mm)</label><input type="number" id="stdL" value="1220"></div>
                <button class="btn-tambah" onclick="tambahItem()">+ Tambah</button>
            </div>
        </div>

        <!-- AREA PRINT (Untuk keperluan Export Gambar & PDF) -->
        <div id="areaPrint">
            <h2 id="judulPrint" style="display:none; text-align:center; color:black;">Data Proyek</h2>
            
            <h2><span>Rincian Kebutuhan</span> <button style="background:#e74c3c; color:white;" class="hide-on-print" onclick="bersihkanTabel()">🧹 Bersihkan Tabel</button></h2>
            <div class="table-responsive">
                <table id="tableRincian">
                    <thead>
                        <tr><th>Tipe</th><th>Jenis</th><th>Bagian</th><th>Pjg(mm)</th><th>Lbr(mm)</th><th>Qty</th><th>Std Pjg</th><th>Std Lbr</th><th class="hide-on-print">Aksi</th></tr>
                    </thead>
                    <tbody id="tabelRincianBody"></tbody>
                </table>
            </div>

            <h2>
                <span>Rekapitulasi Belanja</span> 
                <div class="hide-on-print">
                    <button class="btn-img" onclick="exportGambar()">📸 Export Gambar</button>
                    <button class="btn-pdf" onclick="exportPDF()">📄 Export PDF</button>
                </div>
            </h2>
            <div class="table-responsive">
                <table id="tableRekap">
                    <thead>
                        <tr><th>Kategori</th><th>Jenis Material</th><th>Ukuran Standar</th><th>Total Kebutuhan</th><th>Butuh (Beli)</th><th>Sisa / Lebih</th></tr>
                    </thead>
                    <tbody id="tabelRekapBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIG FIREBASE
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyC4zqHJlBGXwPCMXvkEGt2OzT9aghb7CAs",
          authDomain: "bengkel-las-ajaib.firebaseapp.com",
          projectId: "bengkel-las-ajaib",
          storageBucket: "bengkel-las-ajaib.firebasestorage.app",
          messagingSenderId: "115215576003",
          appId: "1:115215576003:web:f3a91e8e83946dee9e2b76",
          measurementId: "G-2JWXY1E2TL"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const { jsPDF } = window.jspdf; // Inisialisasi jsPDF

        // Variabel Database
        let projects = { "Proyek Utama": [] };
        let currentProject = "Proyek Utama";
        let dataMaterial = []; 

        // Variabel Undo/Redo
        let historyStack = [];
        let redoStack = [];

        // ==========================================
        // SISTEM UNDO & REDO
        // ==========================================
        function simpanStatusUndo() {
            // Rekam keadaan sebelum melakukan aksi
            historyStack.push({
                projectsData: JSON.parse(JSON.stringify(projects)), 
                activeProject: currentProject
            });
            if(historyStack.length > 20) historyStack.shift(); // Batas memori 20 langkah
            redoStack = []; // Bersihkan redo setiap ada aksi baru
        }

        function undoAksi() {
            if(historyStack.length === 0) return alert("Tidak ada data untuk di-undo!");
            
            redoStack.push({ projectsData: JSON.parse(JSON.stringify(projects)), activeProject: currentProject });
            let statusSblm = historyStack.pop();
            
            projects = statusSblm.projectsData;
            currentProject = statusSblm.activeProject;
            
            simpanKeCloud(false); // Simpan tanpa menambah undo state
        }

        function redoAksi() {
            if(redoStack.length === 0) return alert("Tidak ada data untuk di-redo!");
            
            historyStack.push({ projectsData: JSON.parse(JSON.stringify(projects)), activeProject: currentProject });
            let statusMaju = redoStack.pop();
            
            projects = statusMaju.projectsData;
            currentProject = statusMaju.activeProject;
            
            simpanKeCloud(false);
        }

        // ==========================================
        // SISTEM IMPORT & EXPORT JSON
        // ==========================================
        function exportJSON() {
            const jsonText = JSON.stringify(projects, null, 2);
            const blob = new Blob([jsonText], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Backup_Bengkel_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const dataMasuk = JSON.parse(e.target.result);
                    simpanStatusUndo();
                    projects = dataMasuk;
                    currentProject = Object.keys(projects)[0] || "Proyek Utama";
                    simpanKeCloud(false);
                    alert("Proyek berhasil di-import!");
                } catch (err) { alert("File tidak valid atau rusak!"); }
            };
            reader.readAsText(file);
        }

        // ==========================================
        // SISTEM EXPORT PDF & GAMBAR (PRINT)
        // ==========================================
        function siapkanTampilanPrint(status) {
            const sembunyi = document.querySelectorAll('.hide-on-print');
            sembunyi.forEach(el => el.style.display = status ? 'none' : '');
            
            const judul = document.getElementById('judulPrint');
            judul.innerText = `Data Material: ${currentProject}`;
            judul.style.display = status ? 'block' : 'none';
        }

        function exportGambar() {
            siapkanTampilanPrint(true);
            const area = document.getElementById('areaPrint');
            html2canvas(area, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${currentProject}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                siapkanTampilanPrint(false);
            });
        }

        function exportPDF() {
            siapkanTampilanPrint(true);
            const area = document.getElementById('areaPrint');
            html2canvas(area, { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save(`${currentProject}.pdf`);
                siapkanTampilanPrint(false);
            });
        }


        // ==========================================
        // LOGIN & SINKRONISASI
        // ==========================================
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('userName').innerText = user.email;
                mulaiRealtimeSync(); 
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('appContent').style.display = 'none';
            }
        });

        function loginManual() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorDiv = document.getElementById('loginError');

            if(!email || !password) {
                errorDiv.innerText = "Email dan password tidak boleh kosong!";
                errorDiv.style.color = "#ff7675";
                return;
            }

            errorDiv.innerText = "⏳ Sedang memeriksa...";
            errorDiv.style.color = "#3498db";

            firebase.auth().signInWithEmailAndPassword(email, password).catch(() => {
                errorDiv.style.color = "#ff7675"; errorDiv.innerText = "⚠️ Login Gagal! Pastikan Email dan Password benar.";
            });
        }

        function logoutManual() { auth.signOut(); }

        function mulaiRealtimeSync() {
            db.collection("bengkel").doc("data_kalkulator").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.projects) projects = data.projects;
                    if (data.currentProject && projects[data.currentProject]) {
                        currentProject = data.currentProject;
                    } else {
                        currentProject = Object.keys(projects)[0];
                    }
                } else {
                    projects = { "Proyek Utama": [] };
                    currentProject = "Proyek Utama";
                    simpanKeCloud(false);
                }
                updateProjectUI();
                
                const status = document.getElementById('saveStatus');
                status.innerText = "🟢 Real-time aktif"; 
                status.style.color = "#27ae60";
            });
        }

        // ==========================================
        // MANAJEMEN DATA & UI
        // ==========================================
        function simpanKeCloud(tambahUndo = true) {
            if(tambahUndo) simpanStatusUndo();
            projects[currentProject] = dataMaterial; 
            const status = document.getElementById('saveStatus');
            status.innerText = "⏳ Menyimpan..."; status.style.color = "#d35400";
            
            db.collection("bengkel").doc("data_kalkulator").set({
                projects: projects,
                currentProject: currentProject,
                terakhirDiupdate: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { status.innerText = "🟢 Real-time aktif"; status.style.color = "#27ae60"; });
        }

        function updateProjectUI() {
            const selector = document.getElementById('projectSelector');
            selector.innerHTML = '';
            for (let proj in projects) {
                let opt = document.createElement('option');
                opt.value = proj; opt.innerText = proj;
                selector.appendChild(opt);
            }
            
            // Langsung fokus (menuju) ke proyek yang sedang aktif
            selector.value = currentProject;
            dataMaterial = projects[currentProject] || [];
            renderTabel();
        }

        function gantiProyek() {
            simpanStatusUndo();
            projects[currentProject] = dataMaterial; 
            currentProject = document.getElementById('projectSelector').value;
            dataMaterial = projects[currentProject] || [];
            simpanKeCloud(false);
        }

        function buatProyekBaru() {
            let nama = prompt("Masukkan nama proyek baru:");
            if (nama && nama.trim() !== "") {
                if (projects[nama]) return alert("Nama proyek sudah ada!");
                simpanStatusUndo();
                projects[currentProject] = dataMaterial; 
                projects[nama] = []; 
                currentProject = nama; 
                dataMaterial = projects[currentProject];
                simpanKeCloud(false);
            }
        }

        function ubahNamaProyek() {
            let namaBaru = prompt("Ubah nama proyek:", currentProject);
            if (namaBaru && namaBaru.trim() !== "" && namaBaru !== currentProject) {
                if (projects[namaBaru]) return alert("Nama tersebut sudah dipakai!");
                simpanStatusUndo();
                projects[currentProject] = dataMaterial; 
                projects[namaBaru] = projects[currentProject];
                delete projects[currentProject]; 
                currentProject = namaBaru;
                simpanKeCloud(false);
            }
        }

        function hapusProyek() {
            if (Object.keys(projects).length <= 1) return alert("Minimal harus ada 1 proyek.");
            if (confirm(`Yakin ingin menghapus seluruh data pada "${currentProject}"?`)) {
                simpanStatusUndo();
                delete projects[currentProject];
                currentProject = Object.keys(projects)[0];
                dataMaterial = projects[currentProject] || []; 
                simpanKeCloud(false);
            }
        }

        function bersihkanTabel() {
            if (confirm("Hapus semua rincian di tabel ini?")) {
                dataMaterial = [];
                simpanKeCloud();
            }
        }

        function toggleForm() {
            const tipe = document.getElementById('tipeMaterial').value;
            document.getElementById('col-p').style.display = tipe !== 'baut' ? 'block' : 'none';
            document.getElementById('col-l').style.display = tipe === 'plat' ? 'block' : 'none';
            document.getElementById('col-stdP').style.display = tipe !== 'baut' ? 'block' : 'none';
            document.getElementById('col-stdL').style.display = tipe === 'plat' ? 'block' : 'none';
            if(tipe === 'besi') { document.getElementById('label-stdP').innerText = 'Std Pjg (mm)'; document.getElementById('stdP').value = 6000; }
            if(tipe === 'plat') { document.getElementById('label-stdP').innerText = 'Std Pjg (mm)'; document.getElementById('stdP').value = 2440; document.getElementById('stdL').value = 1220; }
        }

        function tambahItem() {
            const tipe = document.getElementById('tipeMaterial').value;
            const jenis = document.getElementById('jenis').value.trim();
            const bagian = document.getElementById('bagian').value.trim();
            const qty = parseInt(document.getElementById('qty').value) || 0;
            const p = tipe !== 'baut' ? parseFloat(document.getElementById('p').value) || 0 : 0;
            const l = tipe === 'plat' ? parseFloat(document.getElementById('l').value) || 0 : 0;
            const stdP = tipe !== 'baut' ? parseFloat(document.getElementById('stdP').value) || 0 : 0;
            const stdL = tipe === 'plat' ? parseFloat(document.getElementById('stdL').value) || 0 : 0;

            if (!jenis || qty <= 0) return alert("Jenis dan Qty wajib diisi!");
            
            dataMaterial.push({ id: Date.now(), tipe, jenis, bagian, p, l, qty, stdP, stdL });
            
            document.getElementById('bagian').value = ''; 
            document.getElementById('qty').value = '1'; 
            document.getElementById('jenis').focus(); 
            
            simpanKeCloud(); 
        }

        function hapusItem(id) { 
            dataMaterial = dataMaterial.filter(item => item.id !== id); 
            simpanKeCloud(); 
        }
        
        function updateData(id, field, value) {
            let item = dataMaterial.find(x => x.id === id);
            if(item) {
                let parsedVal = ['p','l','qty','stdP','stdL'].includes(field) ? (parseFloat(value) || 0) : value.trim();
                if (item[field] !== parsedVal) { 
                    item[field] = parsedVal; 
                    simpanKeCloud(); 
                }
            }
        }

        function renderTabel() {
            const tbodyRincian = document.getElementById('tabelRincianBody');
            const tbodyRekap = document.getElementById('tabelRekapBody');
            tbodyRincian.innerHTML = ''; tbodyRekap.innerHTML = '';
            let rekapMap = {};

            dataMaterial.forEach(item => {
                const isBesi = item.tipe === 'besi', isPlat = item.tipe === 'plat', isBaut = item.tipe === 'baut';
                tbodyRincian.innerHTML += `
                    <tr>
                        <td>${item.tipe.toUpperCase()}</td>
                        <td contenteditable="true" onblur="updateData(${item.id}, 'jenis', this.innerText)">${item.jenis}</td>
                        <td contenteditable="true" onblur="updateData(${item.id}, 'bagian', this.innerText)">${item.bagian}</td>
                        <td ${!isBaut ? 'contenteditable="true"' : ''} onblur="updateData(${item.id}, 'p', this.innerText)">${!isBaut ? item.p : '-'}</td>
                        <td ${isPlat ? 'contenteditable="true"' : ''} onblur="updateData(${item.id}, 'l', this.innerText)">${isPlat ? item.l : '-'}</td>
                        <td contenteditable="true" onblur="updateData(${item.id}, 'qty', this.innerText)">${item.qty}</td>
                        <td ${!isBaut ? 'contenteditable="true"' : ''} onblur="updateData(${item.id}, 'stdP', this.innerText)">${!isBaut ? item.stdP : '-'}</td>
                        <td ${isPlat ? 'contenteditable="true"' : ''} onblur="updateData(${item.id}, 'stdL', this.innerText)">${isPlat ? item.stdL : '-'}</td>
                        <td class="hide-on-print"><button class="delete-btn" onclick="hapusItem(${item.id})">Hapus</button></td>
                    </tr>
                `;

                let key = `${item.tipe}-${item.jenis}`;
                if (!rekapMap[key]) rekapMap[key] = { tipe: item.tipe, jenis: item.jenis, totalKebutuhan: 0, stdP: item.stdP, stdL: item.stdL };
                if (isBesi) rekapMap[key].totalKebutuhan += (item.p * item.qty);
                else if (isPlat) rekapMap[key].totalKebutuhan += (item.p * item.l * item.qty);
                else if (isBaut) rekapMap[key].totalKebutuhan += item.qty;
            });

            for (const key in rekapMap) {
                const data = rekapMap[key];
                let teksKebutuhan = '', teksBeli = '', teksSisa = '', teksStandar = '';
                if (data.tipe === 'besi') {
                    let butuhLonjor = Math.ceil(data.totalKebutuhan / data.stdP);
                    teksStandar = `${data.stdP} mm`; teksKebutuhan = `${data.totalKebutuhan} mm`; 
                    teksBeli = `${butuhLonjor} Ljr`; teksSisa = ((butuhLonjor * data.stdP) - data.totalKebutuhan > 0) ? `${(butuhLonjor * data.stdP) - data.totalKebutuhan} mm` : '0';
                } else if (data.tipe === 'plat') {
                    let luasLembar = data.stdP * data.stdL; let butuhLembar = Math.ceil(data.totalKebutuhan / luasLembar);
                    let sisaLuas = (butuhLembar * luasLembar) - data.totalKebutuhan;
                    teksStandar = `${data.stdP}x${data.stdL}`; teksKebutuhan = `${(data.totalKebutuhan / 1000000).toFixed(2)} m²`; 
                    teksBeli = `${butuhLembar} Lbr`; teksSisa = sisaLuas > 0 ? `${(sisaLuas / 1000000).toFixed(2)} m²` : '0';
                } else if (data.tipe === 'baut') {
                    teksStandar = '-'; teksKebutuhan = `${data.totalKebutuhan} Pcs`; teksBeli = `${data.totalKebutuhan} Pcs`; teksSisa = '-';
                }
                tbodyRekap.innerHTML += `<tr><td><strong>${data.tipe.toUpperCase()}</strong></td><td>${data.jenis}</td><td>${teksStandar}</td><td>${teksKebutuhan}</td><td style="color:#27ae60; font-weight:bold;">${teksBeli}</td><td>${teksSisa}</td></tr>`;
            }
        }
        
        window.onload = function() { toggleForm(); };
    </script>
</body>
</html>
